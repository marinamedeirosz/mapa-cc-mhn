<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mapa CC MHN">
  <!-- Marcador de mapa com um caranguejo: coleção carcinológica + localização -->
  <path fill="#005e4c" d="M32 2C19.3 2 9 12.1 9 24.6c0 16.6 19.4 35.4 21.6 37.5a2 2 0 0 0 2.8 0C35.6 60 55 41.2 55 24.6 55 12.1 44.7 2 32 2Z"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.4">
    <!-- pernas -->
    <path d="M23.5 28.5 18 31.5M23.5 31.5l-4.5 4.5M25.5 34l-3 5"/>
    <path d="M40.5 28.5 46 31.5M40.5 31.5l4.5 4.5M38.5 34l3 5"/>
    <!-- braços até as pinças -->
    <path d="M25 24.5 20.5 18.5M39 24.5l4.5-6"/>
    <!-- olhos (pedúnculos) -->
    <path d="M29.5 22.5v-4M34.5 22.5v-4"/>
  </g>
  <g fill="#fff">
    <!-- carapaça -->
    <ellipse cx="32" cy="28.5" rx="9.5" ry="7"/>
    <!-- pinças -->
    <circle cx="18.5" cy="15.5" r="5.4"/>
    <circle cx="45.5" cy="15.5" r="5.4"/>
    <circle cx="29.5" cy="17.6" r="1.9"/>
    <circle cx="34.5" cy="17.6" r="1.9"/>
  </g>
  <!-- corte em V que transforma os círculos em pinças -->
  <path fill="#005e4c" d="M18.5 15.5 13.4 12.3 15.9 10.1ZM45.5 15.5 50.6 12.3 48.1 10.1Z"/>
</svg>
